      type: integer
      description: |-
        * `1` - Очень маленький
        * `2` - Маленький
        * `3` - Средний
        * `4` - Большой
        * `5` - Очень большой
    Purchase:
      type: object
      description: Serialize a verified purchase back to the client.
      properties:
        platform:
          allOf:
          - $ref: '#/components/schemas/PlatformEnum'
          readOnly: true
          title: Платформа
        product_id:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: Статус
        verified_at:
          type: string
          format: date-time
          readOnly: true
          title: Подтверждено
      required:
      - platform
      - product_id
      - status
      - verified_at
    PurchaseVerifyRequestRequest:
      type: object
      description: |-
        Validates a client's request to verify a store purchase.

        `purchase_token` is required for Android (needed again to acknowledge)
        and unused for iOS. `signed_transaction_info` is required for iOS (the
        JWS StoreKit hands the client for its own transaction) and unused for
        Android. `store_transaction_id` is required for iOS but optional for
        Android: Google leaves `orderId` unset until a pending payment clears,
        so an Android client reporting a purchase it saw as PENDING has no id to
        send and would otherwise be refused here instead of being told to retry.
        `device_id` is only used when the request is unauthenticated.
      properties:
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        product_id:
          type: string
          minLength: 1
          maxLength: 100
        store_transaction_id:
          type: string
          default: ''
          maxLength: 255
        purchase_token:
          type: string
          default: ''
        signed_transaction_info:
          type: string
          default: ''
        device_id:
          type: string
          default: ''
          maxLength: 64
      required:
      - platform
      - product_id
    RefreshToken:
      type: object
      description: |-
        Refuse refresh tokens whose user no longer exists.

        simplejwt looks the user up without catching DoesNotExist, so a token that
        outlives its user would surface as a 500. That happens when the user is
        deleted in the admin, or when a refresh races `delete_account` and its
        rotated token is stored after the blacklisting.
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    RefreshTokenRequest:
      type: object
      description: |-
        Refuse refresh tokens whose user no longer exists.

        simplejwt looks the user up without catching DoesNotExist, so a token that
        outlives its user would surface as a 500. That happens when the user is
        deleted in the admin, or when a refresh races `delete_account` and its
        rotated token is stored after the blacklisting.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
