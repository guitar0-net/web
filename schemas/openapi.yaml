openapi: 3.0.3
info:
  title: Guitar0 API
  version: main
  description: Django REST API for guitar0.net platform
paths:
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Verify the Google ID token and return JWT tokens for the user.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthResponse'
          description: ''
        '400':
          description: Missing `id_token`, or the token failed verification.
        '403':
          description: The Google account resolves to a staff or superuser.
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Rotate a refresh token for a new access/refresh pair.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshToken'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: Verify that a JWT access token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Return the requesting user's profile fields.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    delete:
      operationId: auth_me_destroy
      description: Delete the requesting user's account.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist the given refresh token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/chords/:
    get:
      operationId: chords_list
      description: List all chords.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - chords
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChordsListList'
          description: ''
  /api/v1/chords/{id}/:
    get:
      operationId: chords_retrieve
      description: Retrieve a single chord by ID.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - chords
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChordDetail'
          description: ''
  /api/v1/lessons/:
    get:
      operationId: lessons_list
      description: List all published lessons.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - lessons
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLessonsListList'
          description: ''
  /api/v1/lessons/{uuid}/:
    get:
      operationId: lessons_retrieve
      description: Retrieve a single published lesson by UUID.
      parameters:
      - in: query
        name: course
        schema:
          type: string
        description: UUID of the parent course. When provided, populates the `course`
          field in the response for breadcrumb rendering.
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - lessons
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonDetail'
          description: ''
  /api/v1/songs/{uuid}/print/:
    post:
      operationId: songs_print_create
      description: Accept print settings and return the song as a PDF document.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - songs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongPrintSettingsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SongPrintSettingsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SongPrintSettingsRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: The song rendered as a PDF document.
        '400':
          description: Invalid print settings.
        '404':
          description: No such song.
        '429':
          description: Print rate limit exceeded.
  /api/v1/courses/:
    get:
      operationId: courses_list
      description: List all published courses.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - courses
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCoursesListList'
          description: ''
  /api/v1/courses/{uuid}/:
    get:
      operationId: courses_retrieve
      description: Retrieve a single published course by UUID.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - courses
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
  /api/v1/announcements/:
    get:
      operationId: announcements_list
      description: List all published announcements.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - announcements
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementsListList'
          description: ''
  /api/v1/announcements/{uuid}/:
    get:
      operationId: announcements_retrieve
      description: Retrieve a single published announcement by UUID.
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - announcements
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetail'
          description: ''
  /api/v1/sync/lessons/:
    get:
      operationId: sync_lessons_retrieve
      description: Return flat sync payload.
      parameters:
      - in: query
        name: since
        schema:
          type: string
        description: ISO-8601 timestamp. When provided, only lessons updated after
          this point are included in `lessons`, `songs`, `chords`, and `schemes`.
          `lesson_uuids` always contains the full set of published UUIDs regardless
          of this parameter.
      tags:
      - sync
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncLessonsResponse'
          description: ''
  /api/v1/sync/version/:
    get:
      operationId: sync_version_retrieve
      description: Return current content version.
      tags:
      - sync
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentVersionResponse'
          description: ''
  /api/v1/donations/products/:
    get:
      operationId: donations_products_list
      description: List active donation products clients can offer for purchase.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - donations
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDonationProductListList'
          description: ''
  /api/v1/donations/verify/:
    post:
      operationId: donations_verify_create
      description: Validate the purchase payload and verify it against the store.
      tags:
      - donations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseVerifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseVerifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseVerifyRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyError'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyError'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyError'
          description: ''
  /api/v1/donations/claim/:
    post:
      operationId: donations_claim_create
      description: Claim all unclaimed purchases for the given device_id.
      tags:
      - donations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimDeviceRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimDeviceRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimDeviceRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimDeviceResponse'
          description: ''
        '400':
          description: Missing or overlong `device_id`.
        '401':
          description: No valid access token.
components:
  schemas:
    AnnouncementDetail:
      type: object
      description: Serializer for announcement detail.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          title: Заголовок
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        content:
          type: string
          title: Содержание
        product_version:
          type: string
          title: Версия продукта
          description: 'Например: 1.2.0'
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
      required:
      - content
      - created_at
      - slug
      - title
      - updated_at
      - uuid
    AnnouncementsList:
      type: object
      description: Serializer for announcements list.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          title: Заголовок
          maxLength: 200
        slug:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        content:
          type: string
          title: Содержание
        product_version:
          type: string
          title: Версия продукта
          description: 'Например: 1.2.0'
          maxLength: 50
        published_at:
          type: string
          format: date-time
          nullable: true
          title: Дата-время публикации
      required:
      - content
      - slug
      - title
      - uuid
    ChordDetail:
      type: object
      description: Serializer for chord detail.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 50
        musical_title:
          type: string
          title: Музыкальное название
          maxLength: 50
        order_in_note:
          type: integer
          maximum: 32767
          minimum: 0
          title: Порядок отображения
        start_fret:
          type: integer
          maximum: 32767
          minimum: 0
          title: С какого лада начинается
        has_barre:
          type: boolean
          title: Есть барре?
        positions:
          type: array
          items:
            $ref: '#/components/schemas/ChordPosition'
          readOnly: true
        svg_horizontal:
          type: string
          title: SVG горизонтальный
        svg_vertical:
          type: string
          title: SVG вертикальный
      required:
      - id
      - musical_title
      - positions
      - title
    ChordEmbedded:
      type: object
      description: |-
        Chord representation for nesting inside a song.

        Omits `positions` — clients render chord diagrams from the pre-rendered
        `svg_horizontal`/`svg_vertical` fields, never from raw string positions
        (same choice already made by `ChordSyncSerializer` for offline sync).
        Keeping it out here avoids prefetching `positions` for every chord in
        every song of a lesson.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 50
        musical_title:
          type: string
          title: Музыкальное название
          maxLength: 50
        order_in_note:
          type: integer
          maximum: 32767
          minimum: 0
          title: Порядок отображения
        start_fret:
          type: integer
          maximum: 32767
          minimum: 0
          title: С какого лада начинается
        has_barre:
          type: boolean
          title: Есть барре?
        svg_horizontal:
          type: string
          title: SVG горизонтальный
        svg_vertical:
          type: string
          title: SVG вертикальный
      required:
      - id
      - musical_title
      - title
    ChordOrientationEnum:
      enum:
      - horizontal
      - vertical
      type: string
      description: |-
        * `horizontal` - Горизонтальный
        * `vertical` - Вертикальный
    ChordPosition:
      type: object
      description: Serializer for one string position.
      properties:
        string_number:
          type: integer
          maximum: 6
          minimum: 1
          title: Номер струны
        fret:
          type: integer
          maximum: 12
          minimum: -1
          title: На каком ладу зажата
          description: 0 - открыта, -1 - заглушена
        finger:
          type: integer
          maximum: 4
          minimum: 0
          title: Каким пальцем зажата
      required:
      - finger
      - fret
      - string_number
    ChordSync:
      type: object
      description: Chord for offline sync.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 50
        musical_title:
          type: string
          title: Музыкальное название
          maxLength: 50
        order_in_note:
          type: integer
          maximum: 32767
          minimum: 0
          title: Порядок отображения
        start_fret:
          type: integer
          maximum: 32767
          minimum: 0
          title: С какого лада начинается
        has_barre:
          type: boolean
          title: Есть барре?
        svg_horizontal:
          type: string
          title: SVG горизонтальный
        svg_vertical:
          type: string
          title: SVG вертикальный
      required:
      - id
      - musical_title
      - title
    ChordsList:
      type: object
      description: Serializer for chords list.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 50
        musical_title:
          type: string
          title: Музыкальное название
          maxLength: 50
        positions:
          type: array
          items:
            $ref: '#/components/schemas/ChordPosition'
          readOnly: true
        svg_horizontal:
          type: string
          title: SVG горизонтальный
        svg_vertical:
          type: string
          title: SVG вертикальный
      required:
      - id
      - musical_title
      - positions
      - title
    ClaimDeviceRequestRequest:
      type: object
      description: Validates the device_id whose anonymous purchases should be claimed.
      properties:
        device_id:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - device_id
    ClaimDeviceResponse:
      type: object
      description: How many anonymous purchases were attached to the user.
      properties:
        claimed:
          type: integer
          readOnly: true
      required:
      - claimed
    ContentVersionResponse:
      type: object
      description: Shape of the /api/v1/sync/version/ response.
      properties:
        version:
          type: string
          nullable: true
      required:
      - version
    CourseDetail:
      type: object
      description: Serializer for course detail.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 200
        description:
          type: string
          title: Описание
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/CourseLessonDetail'
      required:
      - created_at
      - lessons
      - title
      - updated_at
      - uuid
    CourseFlat:
      type: object
      description: Course fields only — memberships are in the top-level course_lessons
        array.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 200
        description:
          type: string
          title: Описание
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата создания
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
      required:
      - created_at
      - title
      - updated_at
      - uuid
    CourseLessonDetail:
      type: object
      description: Serializer for lesson within course detail.
      properties:
        order:
          type: integer
        lesson:
          $ref: '#/components/schemas/LessonsList'
      required:
      - lesson
      - order
    CourseLessonFlat:
      type: object
      description: Course-lesson membership with both UUIDs explicit.
      properties:
        course_uuid:
          type: string
          format: uuid
        lesson_uuid:
          type: string
          format: uuid
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Порядок урока в курсе
      required:
      - course_uuid
      - lesson_uuid
      - order
    CoursesList:
      type: object
      description: Serializer for courses list.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          title: Название
          maxLength: 200
        description:
          type: string
          title: Описание
        lessons_count:
          type: integer
          readOnly: true
      required:
      - lessons_count
      - title
      - uuid
    DonationProductList:
      type: object
      description: |-
        Expose only the product_id field.

        Price and title are resolved by the client directly against the store's
        own SDK using this id — they are deliberately not duplicated here.
      properties:
        product_id:
          type: string
          title: Идентификатор товара
          maxLength: 100
      required:
      - product_id
    GoogleAuthRequestRequest:
      type: object
      description: Validates the incoming Google ID token.
      properties:
        id_token:
          type: string
          minLength: 1
      required:
      - id_token
    GoogleAuthResponse:
      type: object
      description: The JWT access/refresh pair and the signed-in user's profile.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserProfile'
          readOnly: true
      required:
      - access
      - refresh
      - user
    ImageScheme:
      type: object
      description: Output serializer for an image scheme.
      properties:
        id:
          type: integer
          readOnly: true
        inscription:
          type: string
          title: Надпись
          maxLength: 100
        image:
          type: string
          format: uri
          title: Изображение
        height:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Высота
        width:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Ширина
      required:
      - id
      - image
    LessonDetail:
      type: object
      description: Serializer for lesson detail.
      properties:
